[project]
name = "social-network-analysis"
version = "0.1.0"
requires-python = ">=3.14"
readme = "README.md"
dependencies = [
    "igraph>=1.0.0",
    "matplotlib>=3.11.2",
    "networkx>=3.7",
    "numpy>=2.5.3",
    "python-igraph>=1.0.0",
]

[tool.uv]
package = false

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"
